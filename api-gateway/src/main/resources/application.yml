server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          routes:
            - id: auth
              uri: lb://ms-auth
              predicates:
                - Path=/api/aute/**
            - id: usuarios
              uri: lb://ms-usuarios
              predicates:
                - Path=/api/usuarios/**
            - id: productos
              uri: lb://ms-productos
              predicates:
                - Path=/api/productos/**
            - id: servicios
              uri: lb://ms-servicios
              predicates:
                - Path=/api/servicios/**
            - id: ordenes
              uri: lb://ms-ordenes
              predicates:
                - Path=/api/ordenes/**
            - id: consultas
              uri: lb://ms-consulta
              predicates:
                - Path=/api/consultas/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
