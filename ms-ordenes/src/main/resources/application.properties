spring.application.name=ms-ordenes
server.port=${SERVER_PORT:8084}

spring.datasource.url=${ORDENES_DB_URL:jdbc:mysql://localhost:3306/ordenes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET}
ms.productos.url=${MS_PRODUCTOS_URL:http://localhost:8081/api/productos}
boleta.iva-rate=${BOLETA_IVA_RATE:0.19}
boleta.issuer-name=${BOLETA_EMISOR_RAZON_SOCIAL:Veterinaria San Marcos}
boleta.issuer-rut=${BOLETA_EMISOR_RUT:No configurado (prueba)}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
