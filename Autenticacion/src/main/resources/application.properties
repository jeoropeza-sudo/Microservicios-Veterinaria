spring.application.name=ms-auth
server.port=${SERVER_PORT:8083}


spring.datasource.url=${AUTENTICACION_DB_URL:jdbc:mysql://localhost:3306/Autenticacion?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave secreta para firmar JWT (debe tener al menos 32 caracteres / 256 bits)
jwt.secret=${JWT_SECRET}
# Tiempo de expiración en milisegundos (ej. 3600000 = 1 hora)
jwt.expiration=3600000

# URL base del microservicio de usuarios (ajusta el puerto según corresponda)
ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8085/api/usuarios}
usuarios.internal.secret=${USUARIOS_INTERNAL_SECRET:${JWT_SECRET}}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}