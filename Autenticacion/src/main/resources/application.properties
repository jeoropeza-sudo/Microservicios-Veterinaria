spring.application.name=Autenticacion
server.port=8081


spring.datasource.url=jdbc:mysql://localhost:3306/Autenticacion?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave secreta para firmar JWT (debe tener al menos 32 caracteres / 256 bits)
jwt.secret=ClaveSecretaSuperSeguraParaMicroservicioAutenticacion2026!
# Tiempo de expiración en milisegundos (ej. 3600000 = 1 hora)
jwt.expiration=3600000

# URL base del microservicio de usuarios (ajusta el puerto según corresponda)
ms.usuarios.url=http://localhost:8082/api/usuarios